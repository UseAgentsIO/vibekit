  vibekit: "^1.0.0"
  pi: ">=0.50.0"
  node: ">=20"

source:
  repository: "https://github.com/UseAgentsIO/vibekit"
  revision: "v1.0.0"

license: MIT

providesCapabilities:
  - policy.untrusted-inbound

requires:
  required: []
  optional: []
  recommended: []
  conflicts: []

requestsPermissions: []

secrets: []

files:
  - source: payload/policy.yaml
    target: .vibekit/components/policies/untrusted-inbound.yaml
    ownership: exclusive

configuration:
  target: .vibekit/config/policies/untrusted-inbound.yaml
  schema: config.schema.json
