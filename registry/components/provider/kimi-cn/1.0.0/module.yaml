schemaVersion: 1

id: provider:kimi-cn
type: provider
name: kimi-cn
displayName: Kimi CN
version: 1.0.0
description: Maps to Pi's moonshotai-cn provider (Kimi China).

compatibility:
  vibekit: "^1.0.0"
  pi: ">=0.50.0"
  node: ">=20"

source:
  repository: "https://github.com/UseAgentsIO/vibekit"
  revision: "v1.0.0"

license: MIT

providesCapabilities:
  - provider.kimi-cn

requires:
  required: []
  optional: []
  recommended: []
  conflicts: []

requestsPermissions: []

secrets:
  - name: KIMI_CN_API_KEY
    required: true
    source: environment

files:
  - source: payload/provider.yaml
    target: .vibekit/components/providers/kimi-cn.yaml
    ownership: exclusive

configuration:
  target: .vibekit/config/providers/kimi-cn.yaml
  schema: config.schema.json

healthCheck:
  type: pi-provider
  name: moonshotai-cn
