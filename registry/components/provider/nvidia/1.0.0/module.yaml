schemaVersion: 1

id: provider:nvidia
type: provider
name: nvidia
displayName: NVIDIA
version: 1.0.0
description: Maps to Pi's nvidia provider (NIM / build.nvidia.com).

compatibility:
  vibekit: "^1.0.0"
  pi: ">=0.50.0"
  node: ">=20"

source:
  repository: "https://github.com/UseAgentsIO/vibekit"
  revision: "v1.0.0"

license: MIT

providesCapabilities:
  - provider.nvidia

requires:
  required: []
  optional: []
  recommended: []
  conflicts: []

requestsPermissions: []

secrets:
  - name: NVIDIA_API_KEY
    required: true
    source: environment

files:
  - source: payload/provider.yaml
    target: .vibekit/components/providers/nvidia.yaml
    ownership: exclusive

configuration:
  target: .vibekit/config/providers/nvidia.yaml
  schema: config.schema.json

healthCheck:
  type: pi-provider
  name: nvidia
