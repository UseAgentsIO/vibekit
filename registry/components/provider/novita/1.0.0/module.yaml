schemaVersion: 1

id: provider:novita
type: provider
name: novita
displayName: Novita Provider
version: 1.0.0
description: Declares Pi Novita provider configuration and a credential reference.

compatibility:
  vibekit: "^1.0.0"
  pi: ">=0.50.0"
  node: ">=20"

source:
  repository: "https://github.com/UseAgentsIO/vibekit"
  revision: "v1.0.0"

license: MIT

providesCapabilities:
  - provider.novita

requires:
  required: []
  optional: []
  recommended: []
  conflicts: []

requestsPermissions: []

secrets:
  - name: NOVITA_API_KEY
    required: true
    source: environment

files:
  - source: payload/provider.yaml
    target: .vibekit/components/providers/novita.yaml
    ownership: exclusive

configuration:
  target: .vibekit/config/providers/novita.yaml
  schema: config.schema.json

healthCheck:
  type: pi-provider
  name: novita
