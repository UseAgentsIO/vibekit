schemaVersion: 1

id: provider:opencode
type: provider
name: opencode
displayName: OpenCode Zen
version: 1.0.0
description: Maps to Pi's opencode provider (OpenCode Zen). Does not rebuild the Pi provider runtime.

compatibility:
  vibekit: "^1.0.0"
  pi: ">=0.50.0"
  node: ">=20"

source:
  repository: "https://github.com/UseAgentsIO/vibekit"
  revision: "v1.0.0"

license: MIT

providesCapabilities:
  - provider.opencode

requires:
  required: []
  optional: []
  recommended: []
  conflicts: []

requestsPermissions: []

secrets:
  - name: OPENCODE_API_KEY
    required: true
    source: environment

files:
  - source: payload/provider.yaml
    target: .vibekit/components/providers/opencode.yaml
    ownership: exclusive

configuration:
  target: .vibekit/config/providers/opencode.yaml
  schema: config.schema.json

healthCheck:
  type: pi-provider
  name: opencode
