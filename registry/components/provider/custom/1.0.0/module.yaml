schemaVersion: 1

id: provider:custom
type: provider
name: custom
displayName: Custom
version: 1.0.0
description: Maps to Pi's custom provider for any OpenAI-compatible endpoint. CUSTOM_API_KEY is optional.

compatibility:
  vibekit: "^1.0.0"
  pi: ">=0.50.0"
  node: ">=20"

source:
  repository: "https://github.com/UseAgentsIO/vibekit"
  revision: "v1.0.0"

license: MIT

providesCapabilities:
  - provider.custom

requires:
  required: []
  optional: []
  recommended: []
  conflicts: []

requestsPermissions: []

secrets:
  - name: CUSTOM_API_KEY
    required: false
    source: environment

files:
  - source: payload/provider.yaml
    target: .vibekit/components/providers/custom.yaml
    ownership: exclusive

configuration:
  target: .vibekit/config/providers/custom.yaml
  schema: config.schema.json

healthCheck:
  type: pi-provider
  name: custom
