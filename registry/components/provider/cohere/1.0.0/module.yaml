schemaVersion: 1

id: provider:cohere
type: provider
name: cohere
displayName: Cohere Provider
version: 1.0.0
description: Declares Pi Cohere provider configuration and a credential reference.

compatibility:
  vibekit: "^1.0.0"
  pi: ">=0.50.0"
  node: ">=20"

source:
  repository: "https://github.com/UseAgentsIO/vibekit"
  revision: "v1.0.0"

license: MIT

providesCapabilities:
  - provider.cohere

requires:
  required: []
  optional: []
  recommended: []
  conflicts: []

requestsPermissions: []

secrets:
  - name: COHERE_API_KEY
    required: true
    source: environment

files:
  - source: payload/provider.yaml
    target: .vibekit/components/providers/cohere.yaml
    ownership: exclusive

configuration:
  target: .vibekit/config/providers/cohere.yaml
  schema: config.schema.json

healthCheck:
  type: pi-provider
  name: cohere
