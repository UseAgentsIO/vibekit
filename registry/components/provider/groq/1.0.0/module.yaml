schemaVersion: 1

id: provider:groq
type: provider
name: groq
displayName: Groq
version: 1.0.0
description: Maps to Pi's groq provider.

compatibility:
  vibekit: "^1.0.0"
  pi: ">=0.50.0"
  node: ">=20"

source:
  repository: "https://github.com/UseAgentsIO/vibekit"
  revision: "v1.0.0"

license: MIT

providesCapabilities:
  - provider.groq

requires:
  required: []
  optional: []
  recommended: []
  conflicts: []

requestsPermissions: []

secrets:
  - name: GROQ_API_KEY
    required: true
    source: environment

files:
  - source: payload/provider.yaml
    target: .vibekit/components/providers/groq.yaml
    ownership: exclusive

configuration:
  target: .vibekit/config/providers/groq.yaml
  schema: config.schema.json

healthCheck:
  type: pi-provider
  name: groq
