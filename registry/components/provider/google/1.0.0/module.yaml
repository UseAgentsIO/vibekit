schemaVersion: 1

id: provider:google
type: provider
name: google
displayName: Google
version: 1.0.0
description: Maps to Pi's google provider (Gemini). Secret is GEMINI_API_KEY; Pi may also read GOOGLE_API_KEY.

compatibility:
  vibekit: "^1.0.0"
  pi: ">=0.50.0"
  node: ">=20"

source:
  repository: "https://github.com/UseAgentsIO/vibekit"
  revision: "v1.0.0"

license: MIT

providesCapabilities:
  - provider.google

requires:
  required: []
  optional: []
  recommended: []
  conflicts: []

requestsPermissions: []

secrets:
  - name: GEMINI_API_KEY
    required: true
    source: environment

files:
  - source: payload/provider.yaml
    target: .vibekit/components/providers/google.yaml
    ownership: exclusive

configuration:
  target: .vibekit/config/providers/google.yaml
  schema: config.schema.json

healthCheck:
  type: pi-provider
  name: google
