schemaVersion: 1

id: provider:openai
type: provider
name: openai
displayName: OpenAI Provider
version: 1.0.0
description: Declares Pi OpenAI provider configuration and a credential reference. Does not rebuild the Pi provider runtime.

compatibility:
  vibekit: "^1.0.0"
  pi: ">=0.50.0"
  node: ">=20"

source:
  repository: "https://github.com/UseAgentsIO/vibekit"
  revision: "v1.0.0"

license: MIT

providesCapabilities:
  - provider.openai

requires:
  required: []
  optional: []
  recommended: []
  conflicts: []

requestsPermissions: []

secrets:
  - name: OPENAI_API_KEY
    required: true
    source: environment

files:
  - source: payload/provider.yaml
    target: .vibekit/components/providers/openai.yaml
    ownership: exclusive

configuration:
  target: .vibekit/config/providers/openai.yaml
  schema: config.schema.json

healthCheck:
  type: pi-provider
  name: openai
