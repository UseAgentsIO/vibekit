schemaVersion: 1

id: provider:meta-ai
type: provider
name: meta-ai
displayName: Meta AI
version: 1.0.0
description: Maps to Pi's meta-ai provider.

compatibility:
  vibekit: "^1.0.0"
  pi: ">=0.50.0"
  node: ">=20"

source:
  repository: "https://github.com/UseAgentsIO/vibekit"
  revision: "v1.0.0"

license: MIT

providesCapabilities:
  - provider.meta-ai

requires:
  required: []
  optional: []
  recommended: []
  conflicts: []

requestsPermissions: []

secrets:
  - name: MODEL_API_KEY
    required: true
    source: environment

files:
  - source: payload/provider.yaml
    target: .vibekit/components/providers/meta-ai.yaml
    ownership: exclusive

configuration:
  target: .vibekit/config/providers/meta-ai.yaml
  schema: config.schema.json

healthCheck:
  type: pi-provider
  name: meta-ai
