schemaVersion: 1

id: provider:ollama-cloud
type: provider
name: ollama-cloud
displayName: Ollama Cloud Provider
version: 1.0.0
description: Declares Pi Ollama Cloud provider configuration and a credential reference.

compatibility:
  vibekit: "^1.0.0"
  pi: ">=0.50.0"
  node: ">=20"

source:
  repository: "https://github.com/UseAgentsIO/vibekit"
  revision: "v1.0.0"

license: MIT

providesCapabilities:
  - provider.ollama-cloud

requires:
  required: []
  optional: []
  recommended: []
  conflicts: []

requestsPermissions: []

secrets:
  - name: OLLAMA_API_KEY
    required: true
    source: environment

files:
  - source: payload/provider.yaml
    target: .vibekit/components/providers/ollama-cloud.yaml
    ownership: exclusive

configuration:
  target: .vibekit/config/providers/ollama-cloud.yaml
  schema: config.schema.json

healthCheck:
  type: pi-provider
  name: ollama-cloud
