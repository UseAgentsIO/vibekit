schemaVersion: 1

id: provider:arcee
type: provider
name: arcee
displayName: Arcee Provider
version: 1.0.0
description: Declares Pi Arcee provider configuration and a credential reference.

compatibility:
  vibekit: "^1.0.0"
  pi: ">=0.50.0"
  node: ">=20"

source:
  repository: "https://github.com/UseAgentsIO/vibekit"
  revision: "v1.0.0"

license: MIT

providesCapabilities:
  - provider.arcee

requires:
  required: []
  optional: []
  recommended: []
  conflicts: []

requestsPermissions: []

secrets:
  - name: ARCEEAI_API_KEY
    required: true
    source: environment

files:
  - source: payload/provider.yaml
    target: .vibekit/components/providers/arcee.yaml
    ownership: exclusive

configuration:
  target: .vibekit/config/providers/arcee.yaml
  schema: config.schema.json

healthCheck:
  type: pi-provider
  name: arcee
