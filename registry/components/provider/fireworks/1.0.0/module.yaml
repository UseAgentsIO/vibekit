schemaVersion: 1

id: provider:fireworks
type: provider
name: fireworks
displayName: Fireworks Provider
version: 1.0.0
description: Declares Pi Fireworks provider configuration and a credential reference.

compatibility:
  vibekit: "^1.0.0"
  pi: ">=0.50.0"
  node: ">=20"

source:
  repository: "https://github.com/UseAgentsIO/vibekit"
  revision: "v1.0.0"

license: MIT

providesCapabilities:
  - provider.fireworks

requires:
  required: []
  optional: []
  recommended: []
  conflicts: []

requestsPermissions: []

secrets:
  - name: FIREWORKS_API_KEY
    required: true
    source: environment

files:
  - source: payload/provider.yaml
    target: .vibekit/components/providers/fireworks.yaml
    ownership: exclusive

configuration:
  target: .vibekit/config/providers/fireworks.yaml
  schema: config.schema.json

healthCheck:
  type: pi-provider
  name: fireworks
