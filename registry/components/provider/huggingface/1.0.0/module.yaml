schemaVersion: 1

id: provider:huggingface
type: provider
name: huggingface
displayName: Hugging Face
version: 1.0.0
description: Maps to Pi's huggingface provider. Secret is HF_TOKEN; Pi may also read HUGGINGFACE_HUB_TOKEN.

compatibility:
  vibekit: "^1.0.0"
  pi: ">=0.50.0"
  node: ">=20"

source:
  repository: "https://github.com/UseAgentsIO/vibekit"
  revision: "v1.0.0"

license: MIT

providesCapabilities:
  - provider.huggingface

requires:
  required: []
  optional: []
  recommended: []
  conflicts: []

requestsPermissions: []

secrets:
  - name: HF_TOKEN
    required: true
    source: environment

files:
  - source: payload/provider.yaml
    target: .vibekit/components/providers/huggingface.yaml
    ownership: exclusive

configuration:
  target: .vibekit/config/providers/huggingface.yaml
  schema: config.schema.json

healthCheck:
  type: pi-provider
  name: huggingface
