schemaVersion: 1

id: provider:kilocode
type: provider
name: kilocode
displayName: KiloCode
version: 1.0.0
description: Maps to Pi's kilocode provider.

compatibility:
  vibekit: "^1.0.0"
  pi: ">=0.50.0"
  node: ">=20"

source:
  repository: "https://github.com/UseAgentsIO/vibekit"
  revision: "v1.0.0"

license: MIT

providesCapabilities:
  - provider.kilocode

requires:
  required: []
  optional: []
  recommended: []
  conflicts: []

requestsPermissions: []

secrets:
  - name: KILOCODE_API_KEY
    required: true
    source: environment

files:
  - source: payload/provider.yaml
    target: .vibekit/components/providers/kilocode.yaml
    ownership: exclusive

configuration:
  target: .vibekit/config/providers/kilocode.yaml
  schema: config.schema.json

healthCheck:
  type: pi-provider
  name: kilocode
