schemaVersion: 1

id: provider:azure
type: provider
name: azure
displayName: Azure OpenAI
version: 1.0.0
description: Maps to Pi's azure-openai-responses provider (Azure OpenAI / Foundry). Set baseUrl to the Azure resource endpoint.

compatibility:
  vibekit: "^1.0.0"
  pi: ">=0.50.0"
  node: ">=20"

source:
  repository: "https://github.com/UseAgentsIO/vibekit"
  revision: "v1.0.0"

license: MIT

providesCapabilities:
  - provider.azure

requires:
  required: []
  optional: []
  recommended: []
  conflicts: []

requestsPermissions: []

secrets:
  - name: AZURE_OPENAI_API_KEY
    required: true
    source: environment

files:
  - source: payload/provider.yaml
    target: .vibekit/components/providers/azure.yaml
    ownership: exclusive

configuration:
  target: .vibekit/config/providers/azure.yaml
  schema: config.schema.json

healthCheck:
  type: pi-provider
  name: azure-openai-responses
