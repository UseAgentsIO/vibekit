schemaVersion: 1

id: provider:byteplus
type: provider
name: byteplus
displayName: BytePlus
version: 1.0.0
description: Maps to Pi's byteplus provider.

compatibility:
  vibekit: "^1.0.0"
  pi: ">=0.50.0"
  node: ">=20"

source:
  repository: "https://github.com/UseAgentsIO/vibekit"
  revision: "v1.0.0"

license: MIT

providesCapabilities:
  - provider.byteplus

requires:
  required: []
  optional: []
  recommended: []
  conflicts: []

requestsPermissions: []

secrets:
  - name: BYTEPLUS_API_KEY
    required: true
    source: environment

files:
  - source: payload/provider.yaml
    target: .vibekit/components/providers/byteplus.yaml
    ownership: exclusive

configuration:
  target: .vibekit/config/providers/byteplus.yaml
  schema: config.schema.json

healthCheck:
  type: pi-provider
  name: byteplus
