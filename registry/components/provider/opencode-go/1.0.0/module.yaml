schemaVersion: 1

id: provider:opencode-go
type: provider
name: opencode-go
displayName: OpenCode Go
version: 1.0.0
description: Maps to Pi's opencode-go provider. Pi reads OPENCODE_API_KEY for this provider.

compatibility:
  vibekit: "^1.0.0"
  pi: ">=0.50.0"
  node: ">=20"

source:
  repository: "https://github.com/UseAgentsIO/vibekit"
  revision: "v1.0.0"

license: MIT

providesCapabilities:
  - provider.opencode-go

requires:
  required: []
  optional: []
  recommended: []
  conflicts: []

requestsPermissions: []

secrets:
  - name: OPENCODE_API_KEY
    required: true
    source: environment

files:
  - source: payload/provider.yaml
    target: .vibekit/components/providers/opencode-go.yaml
    ownership: exclusive

configuration:
  target: .vibekit/config/providers/opencode-go.yaml
  schema: config.schema.json

healthCheck:
  type: pi-provider
  name: opencode-go
