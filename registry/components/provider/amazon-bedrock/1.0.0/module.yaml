schemaVersion: 1

id: provider:amazon-bedrock
type: provider
name: amazon-bedrock
displayName: Amazon Bedrock
version: 1.0.0
description: Maps to Pi's amazon-bedrock provider. Uses the AWS default credential chain. AWS_REGION and AWS_PROFILE are process environment, not VibeKit secrets.

compatibility:
  vibekit: "^1.0.0"
  pi: ">=0.50.0"
  node: ">=20"

source:
  repository: "https://github.com/UseAgentsIO/vibekit"
  revision: "v1.0.0"

license: MIT

providesCapabilities:
  - provider.amazon-bedrock

requires:
  required: []
  optional: []
  recommended: []
  conflicts: []

requestsPermissions: []

secrets: []

files:
  - source: payload/provider.yaml
    target: .vibekit/components/providers/amazon-bedrock.yaml
    ownership: exclusive

configuration:
  target: .vibekit/config/providers/amazon-bedrock.yaml
  schema: config.schema.json

healthCheck:
  type: pi-provider
  name: amazon-bedrock
