schemaVersion: 1

id: interface:http
type: interface
name: http
displayName: HTTP Interface
version: 1.2.0
description: Local loopback HTTP Interface for programmatic turns. Does not own Project State.

compatibility:
  vibekit: "^1.0.0"
  pi: ">=0.50.0"
  node: ">=20"

source:
  repository: "https://github.com/UseAgentsIO/vibekit"
  revision: "v1.2.0"

license: MIT

providesCapabilities:
  - interface.http

requires:
  required: []
  optional: []
  recommended: []
  conflicts: []

requestsPermissions: []

secrets:
  - name: VIBEKIT_HTTP_TOKEN
    required: true
    source: environment

files:
  - source: payload/interface.yaml
    target: .vibekit/components/interfaces/http.yaml
    ownership: exclusive

configuration:
  target: .vibekit/config/interfaces/http.yaml
  schema: config.schema.json

healthCheck:
  type: pi-interface
  name: http

runtime:
  kind: interface
  package: vibekit:interface-http
  export: createHttpInterface
  lifecycle: singleton

