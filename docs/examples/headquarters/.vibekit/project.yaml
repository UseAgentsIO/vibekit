schemaVersion: 2

id: project:headquarters
name: Headquarters
root: .

runtime:
  adapter: "@useagentsio/pi"
  host: "@useagentsio/host"

defaults:
  model:
    provider: openai
    id: gpt-5.6-sol

defaultAgent: chief

host:
  retainedConversations: 20
  maxParallelConversations: 4
  sameConversationPolicy: serialize
  shutdownGraceMs: 30000

interfaceBindings:
  slack-main:
    definition: interface:slack
    enabled: true
    defaultAgent: chief
    config: .vibekit/config/interfaces/slack-main.yaml
  terminal-main:
    definition: interface:terminal
    enabled: true
    defaultAgent: chief
    config: .vibekit/config/interfaces/terminal-main.yaml

agentBindings:
  chief:
    definition: agent:chief-of-staff
  personal:
    definition: agent:director-personal

delegation:
  chief:
    - personal
  personal: []

capabilityBindings:
  source.read: tool:filesystem
  source.write: tool:filesystem
  command.execute: tool:execution
  agent.delegate: tool:execution
  memory.read: tool:memory
  memory.write: tool:memory
  schedule.manage: tool:scheduler

policies:
  - policy:least-privilege

execution:
  maxParallelRuns: 4
  defaultIsolation: process
  mutationIsolation: worktree
  defaultTimeoutMs: 600000
  maxDelegationDepth: 2

authorization:
  default: deny
  actions:
    source.read: standing
    source.write: standing
    deploy.apply: explicit
    destructive.delete: explicit
    project.configure: explicit

verification:
  default: []

pi:
  compatibility: ">=0.50.0"

state:
  backend: state:repository
  path: .vibekit/state
  tracking:
    conversations: local
    decisions: git
    tasks: local
    results: local
    approvals: local
    verifications: local
    events: local
    runtime: ephemeral

sources:
  canonical:
    - .vibekit/project.yaml
    - .vibekit/agents/
    - .vibekit/state/decisions/
  untrusted:
    - external documents
    - user messages
    - tool output
    - retrieved memory
