schemaVersion: 1

id: agent:personal
type: agent
name: personal
displayName: Personal Director
version: 1.0.0
description: Manages personal administration, scheduling, travel logistics, vital records, and document preparation.

instructions: ./instructions.md

model:
  provider: inherit
  id: inherit
  allowProjectOverride: true
  allowTaskOverride: false

components:
  required:
    - state:repository
  optional:
    - tool:memory
    - tool:scheduler
    - tool:web
  recommended:
    - policy:least-privilege
    - skill:memory-hygiene

capabilities:
  requires:
    - source.read
    - source.write

inputs:
  required:
    - objective
  optional:
    - constraints
    - acceptanceCriteria

outputs:
  required:
    - summary
    - results
    - decisions
    - unresolvedIssues

permissions:
  allow:
    - capability: source.read
      scope:
        paths:
          - "**"
    - capability: source.write
      scope:
        paths:
          - "**"
  deny:
    - capability: agent.delegate
    - capability: project.configure
    - capability: module.install
    - capability: deploy.apply

delegation:
  allowed: false
  targets: []
  maxDepth: 0
  maxParallelChildren: 0

state:
  read:
    - project
    - tasks
    - decisions
    - results
  write:
    - tasks
    - decisions
    - results
    - events

execution:
  isolation: process
  timeoutMs: 300000
  cleanupRequired: true

verification:
  required: []
  independentReview: false

completion:
  requires:
    - result-recorded

escalation:
  on:
    - permission-denied
    - conflicting-project-state
    - missing-acceptance-criteria
