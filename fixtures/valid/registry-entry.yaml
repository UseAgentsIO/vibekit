schemaVersion: 1
id: tool:github
type: tool
name: github
displayName: GitHub Tool
version: 1.0.0
description: Gives authorized Agents scoped GitHub repository access.
publisher: vibekit
source:
  repository: https://github.com/vibekit/registry
  revision: a1b2c3d4e5f6789012345678901234567890abcd
license: MIT
checksum: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
compatibility:
  vibekit: "^1.0.0"
  pi: ">=0.50.0"
  node: ">=20"
requires:
  required:
    - policy:least-privilege
  optional: []
  recommended:
    - policy:require-verification
  conflicts: []
providesCapabilities:
  - repository.read
  - repository.write
  - repository.issue.read
  - repository.issue.write
requestsPermissions:
  - capability: repository.read
  - capability: repository.write
  - capability: repository.issue.read
  - capability: repository.issue.write
secrets:
